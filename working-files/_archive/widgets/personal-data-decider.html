    The includes/ directory is configured as the snippet base path.

  No external dependencies. Pure HTML/CSS/JS.
  Colours use CSS custom properties with safe fallbacks.

<div class="pd-decision-tree" role="region" aria-label="Personal data assessment">
<style>
.pd-decision-tree {
  --pd-text: var(--md-typeset-color, var(--color-text-primary, #2c2c2a));
  --pd-muted: var(--md-default-fg-color--light, var(--color-text-secondary, #5f5e5a));
  --pd-bg: var(--md-default-bg-color, var(--color-background-primary, #fff));
  --pd-bg2: var(--md-code-bg-color, var(--color-background-secondary, #f5f5f0));
  --pd-border: var(--md-default-fg-color--lightest, var(--color-border-tertiary, rgba(0,0,0,0.12)));
  --pd-border-hover: var(--md-default-fg-color--lighter, var(--color-border-secondary, rgba(0,0,0,0.25)));
  --pd-accent: var(--md-primary-fg-color, #4051b5);
  --pd-warn-bg: #faeeda;
  --pd-warn-border: #e8b54a;
  --pd-warn-text: #854f0b;
  --pd-ok-bg: #eaf3de;
  --pd-ok-border: #7db832;
  --pd-ok-text: #3b6d11;
  --pd-radius: 8px;
  font-family: inherit;
  max-width: 640px;
  line-height: 1.6;
}

[data-md-color-scheme="default"] .pd-decision-tree {
  --pd-warn-bg: #faeeda;
  --pd-warn-border: #e8b54a;
  --pd-warn-text: #854f0b;
  --pd-ok-bg: #eaf3de;
  --pd-ok-border: #7db832;
  --pd-ok-text: #3b6d11;
}

[data-md-color-scheme="slate"] .pd-decision-tree {
  --pd-warn-bg: #412402;
  --pd-warn-border: #854f0b;
  --pd-warn-text: #fac775;
  --pd-ok-bg: #173404;
  --pd-ok-border: #3b6d11;
  --pd-ok-text: #c0dd97;
}

@media (prefers-color-scheme: dark) {
  .pd-decision-tree {
    --pd-warn-bg: #412402;
    --pd-warn-border: #854f0b;
    --pd-warn-text: #fac775;
    --pd-ok-bg: #173404;
    --pd-ok-border: #3b6d11;
    --pd-ok-text: #c0dd97;
  }
}

.pd-decision-tree * { box-sizing: border-box; margin: 0; }

.pd-step { display: none; }
.pd-step.active { display: block; }

.pd-progress {
  display: flex; gap: 6px; margin: 0 0 20px;
}
.pd-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--pd-border);
  transition: background 0.2s;
}
.pd-dot.done { background: var(--pd-accent); }
.pd-dot.cur { background: var(--pd-accent); box-shadow: 0 0 0 3px rgba(64,81,181,0.2); }

.pd-q {
  font-size: 1.05em; font-weight: 500;
  color: var(--pd-text);
  margin: 0 0 6px;
}
.pd-hint {
  font-size: 0.85em;
  color: var(--pd-muted);
  margin: 0 0 20px;
}
.pd-opts { display: flex; flex-direction: column; gap: 8px; }
.pd-opt {
  background: var(--pd-bg);
  border: 1px solid var(--pd-border);
  border-radius: var(--pd-radius);
  padding: 12px 16px;
  cursor: pointer;
  text-align: left;
  font-size: 0.9em;
  color: var(--pd-text);
  font-family: inherit;
  line-height: 1.5;
  transition: border-color 0.15s, background 0.15s;
}
.pd-opt:hover {
  border-color: var(--pd-border-hover);
  background: var(--pd-bg2);
}
.pd-opt:focus-visible {
  outline: 2px solid var(--pd-accent);
  outline-offset: 2px;
}

.pd-result {
  border-radius: var(--pd-radius);
  padding: 20px 24px;
  margin: 0 0 16px;
}
.pd-result-pd {
  background: var(--pd-warn-bg);
  border: 1px solid var(--pd-warn-border);
}
.pd-result-anon {
  background: var(--pd-ok-bg);
  border: 1px solid var(--pd-ok-border);
}
.pd-result h3 {
  font-size: 1.05em; font-weight: 500; margin: 0 0 8px;
}
.pd-result-pd h3 { color: var(--pd-warn-text); }
.pd-result-anon h3 { color: var(--pd-ok-text); }
.pd-result-body {
  font-size: 0.9em;
  color: var(--pd-muted);
  line-height: 1.6;
}
.pd-result-body p { margin: 0 0 10px; }
.pd-result-body p:last-child { margin: 0; }
.pd-result-body ul {
  margin: 8px 0 12px;
  padding-left: 20px;
}
.pd-result-body li {
  margin: 4px 0;
}

.pd-nav { display: flex; gap: 8px; margin: 16px 0 0; }
.pd-nav button {
  font-size: 0.85em;
  font-family: inherit;
  background: var(--pd-bg);
  border: 1px solid var(--pd-border);
  border-radius: var(--pd-radius);
  padding: 8px 16px;
  cursor: pointer;
  color: var(--pd-text);
  transition: border-color 0.15s, background 0.15s;
}
.pd-nav button:hover {
  border-color: var(--pd-border-hover);
  background: var(--pd-bg2);
}
.pd-nav button:focus-visible {
  outline: 2px solid var(--pd-accent);
  outline-offset: 2px;
}
</style>

<div class="pd-progress" id="pd-dots" role="group" aria-label="Progress: assessment steps"></div>
<div id="pd-steps" aria-live="polite"></div>

<script>
(function() {
  var steps = [
    {
      q: "Will you record audio or video of people?",
      hint: "A voice on a recording is personal data even if you never ask the participant\u2019s name. The voice itself can identify the speaker.",
      yes: "Yes, we will make audio or video recordings",
      no: "No",
      tag: "Audio or video recordings of identifiable people"
    },
    {
      q: "Will you collect names, national ID numbers, email addresses, or recognisable photographs?",
      hint: "This includes contact details gathered for recruitment, consent forms signed by name, or photographs where someone can be identified.",
      yes: "Yes",
      no: "No, none of these will be recorded at any point",
      tag: "Direct identifiers (names, ID numbers, email, photographs)"
    },
    {
      q: "Will your survey or data collection platform log respondent email or IP addresses?",
      hint: "Most survey tools do this by default. A genuinely anonymous solution must never record these, not even temporarily.",
      yes: "Yes, or I\u2019m not sure",
      no: "No, we have verified the platform does not log these",
      tag: "Platform-logged identifiers (email or IP addresses)"
    },
    {
      q: "Will you maintain a code list or key linking data to real identities?",
      hint: "Pseudonymised data is still personal data. If a key exists that connects codes to real identities, the entire dataset is personal data, regardless of who holds the key.",
      yes: "Yes, we will use pseudonyms with a key",
      no: "No, there will be no link between data and identities",
      tag: "Pseudonymised data with a re-identification key"
    },
    {
      q: "Could combinations of background variables identify someone in your study population?",
      hint: "In a small community, age, gender, village, and occupation together may single out an individual. The smaller your population and the more specific the variables, the higher the risk.",
      yes: "Yes, or possibly",
      no: "No, the population is large enough and the variables are broad",
      tag: "Indirectly identifying combinations of background variables"
    },
    {
      q: "Could participants mention third parties who become identifiable in the data?",
      hint: "If an interviewee names a local official, describes a colleague\u2019s behaviour, or discusses a family member\u2019s health, those third parties become data subjects even though they never took part in the research.",
      yes: "Yes, or likely",
      no: "No, the data will not include identifiable references to others",
      tag: "Identifiable third parties mentioned by participants"
    },
    {
      q: "Will you collect GPS coordinates, geotagged photographs, or other precise location data linked to participants?",
      hint: "A GPS point near a homestead in a rural area can be as identifying as a name. Location data is personal data when it can be connected to identifiable individuals.",
      yes: "Yes",
      no: "No, or only at a level too broad to identify anyone",
      tag: "Precise location data linked to participants"
    },
    {
      q: "Will you collect or analyse social media or internet data that includes usernames or searchable quotes?",
      hint: "Publicly posted content is personal data if it is linked to an identifiable person. Public availability does not exempt it from data protection requirements.",
      yes: "Yes, we will use data linked to online identities",
      no: "No",
      tag: "Online content linked to identifiable users"
    }
  ];

  var cur = 0, answers = [];
  var stepsEl = document.getElementById("pd-steps");
  var dotsEl = document.getElementById("pd-dots");

  function renderDots() {
    dotsEl.innerHTML = "";
    for (var i = 0; i < steps.length; i++) {
      var d = document.createElement("div");
      d.className = "pd-dot";
      d.setAttribute("aria-label", "Step " + (i + 1) + " of " + steps.length);
      if (i < cur) { d.classList.add("done"); d.setAttribute("aria-label", "Step " + (i + 1) + ": answered"); }
      if (i === cur) { d.classList.add("cur"); d.setAttribute("aria-label", "Step " + (i + 1) + ": current"); }
      dotsEl.appendChild(d);
    }
  }

  function showStep(i) {
    cur = i;
    renderDots();
    var s = steps[i];
    var h = '<div class="pd-step active">';
    h += '<p class="pd-q">' + s.q + '</p>';
    h += '<p class="pd-hint">' + s.hint + '</p>';
    h += '<div class="pd-opts" role="group" aria-label="Answer options">';
    h += '<button class="pd-opt" data-answer="yes">' + s.yes + '</button>';
    h += '<button class="pd-opt" data-answer="no">' + s.no + '</button>';
    h += '</div>';
    if (i > 0) {
      h += '<div class="pd-nav"><button data-action="back" aria-label="Go back to previous question">Back</button></div>';
    }
    h += '</div>';
    stepsEl.innerHTML = h;
    stepsEl.querySelectorAll(".pd-opt").forEach(function(btn) {
      btn.addEventListener("click", function() { answer(this.dataset.answer === "yes"); });
    });
    var backBtn = stepsEl.querySelector('[data-action="back"]');
    if (backBtn) backBtn.addEventListener("click", goBack);
  }

  function answer(isYes) {
    answers[cur] = isYes;
    if (cur < steps.length - 1) {
      showStep(cur + 1);
    } else {
      showResult();
    }
  }

  function goBack() {
    if (cur === 0) return;
    showStep(cur - 1);
  }

  function showResult() {
    dotsEl.innerHTML = "";
    var triggers = [];
    for (var i = 0; i < steps.length; i++) {
      if (answers[i]) triggers.push(steps[i].tag);
    }

    var h = '<div class="pd-step active">';

    if (triggers.length > 0) {
      h += '<div class="pd-result pd-result-pd">';
      h += '<h3>Your project involves personal data</h3>';
      h += '<div class="pd-result-body">';
      if (triggers.length === 1) {
        h += '<p>Based on your answers, your project will process personal data in one way:</p>';
      } else {
        h += '<p>Based on your answers, your project will process personal data in ' + triggers.length + ' ways:</p>';
      }
      h += '<ul>';
      for (var j = 0; j < triggers.length; j++) {
        h += '<li>' + triggers[j] + '</li>';
      }
      h += '</ul>';
      h += '<p>You will need a Sikt notification before data collection begins, a legal basis for processing (public interest is the recommended default at CMI), an information letter for participants, secure storage, and a plan for anonymisation or deletion at the end of the project.</p>';
      h += '</div></div>';
    } else {
      h += '<div class="pd-result pd-result-anon">';
      h += '<h3>Your project likely does not involve personal data</h3>';
      h += '<div class="pd-result-body">';
      h += '<p>Based on your answers, your data collection appears to be anonymous throughout. You do not need a Sikt notification, and GDPR requirements for personal data do not apply.</p>';
      h += '<p>You still have ethical obligations to inform participants and obtain their voluntary agreement to take part.</p>';
      h += '</div></div>';
    }

    h += '<div class="pd-nav"><button data-action="restart" aria-label="Start the assessment again">Start over</button></div>';
    h += '</div>';
    stepsEl.innerHTML = h;
    stepsEl.querySelector('[data-action="restart"]').addEventListener("click", restart);
  }

  function restart() { answers = []; showStep(0); }
  showStep(0);
})();
</script>
</div>
